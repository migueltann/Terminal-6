<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Itinerary Builder · Terminal 6</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <!-- Navigation Bar -->
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}">
            <span class="brand-mark">T6</span>

            <span>
                TERMINAL 6
                <small>TRAVEL RECOMMENDATION ASSISTANT</small>
            </span>
        </a>

        <nav class="topbar-links">
            <a class="secondary" href="{{ url_for('saved_sets') }}">Saved trips</a>
            <a class="secondary" href="{{ url_for('itineraries') }}">Itineraries</a>
        </nav>
    </header>

    <main class="shell">

        <!-- Page Introduction -->
        <section class="hero">
            <p class="eyebrow">ITINERARY BUILDER</p>

            <h1>
                Plan your <em>days.</em>
            </h1>

            <p class="hero-copy">
                Choose a day, tap a recommendation to add it, then drag it
                to the time you want. Each day turns red if it goes over
                your daily budget.
            </p>
        </section>

    </main>
</body>
</html>
