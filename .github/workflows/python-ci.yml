
name: Terminal-6 Python CI

on:
  push:
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile \
            main.py \
            ai_manager.py \
            logic_manager.py \
            io_manager.py \
            data_manager.py

      - name: Check there are no class definitions (procedural only)
        run: |
          if grep -nE "^\s*class " *.py tests/*.py; then
            echo "Class definitions found"; exit 1
          fi
          
      - name: Run unit tests
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: python-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t terminal-6 .

      - name: Run tests inside the container
        run: docker run --rm terminal-6 python -m pytest -v
